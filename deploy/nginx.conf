# Example nginx site in front of chatformme (HTTPS).
# Copy to /etc/nginx/sites-available/chatformme and link it into sites-enabled.

server {
    listen 80;
    server_name chat.example.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.example.ir;

    ssl_certificate     /etc/ssl/chatformme/fullchain.pem;
    ssl_certificate_key /etc/ssl/chatformme/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (do not append) so clients cannot fake their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Needed for the live message stream (Server-Sent Events).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
