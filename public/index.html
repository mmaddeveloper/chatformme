<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a18" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>__CHAT_TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M17 19h30a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H31l-9 7v-7h-5a5 5 0 0 1-5-5V24a5 5 0 0 1 5-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>

<svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><path fill="currentColor" d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7.5L7 21.5V18H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm3 6.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5zm4 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5zm4 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="currentColor" d="M3.7 3.2a1 1 0 0 0-1.36 1.2L4.6 11H12a1 1 0 1 1 0 2H4.6l-2.26 6.6a1 1 0 0 0 1.36 1.2l17-8a1 1 0 0 0 0-1.8z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM9 13c-3.9 0-7 2-7 4.5V20h14v-2.5C16 15 12.9 13 9 13zm7.5 0c-.5 0-1 .04-1.47.1 1.5 1.06 2.47 2.6 2.47 4.4V20H22v-2.5c0-2.5-2.46-4.5-5.5-4.5z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 16l-4-4 4-4M5 12h10"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><path stroke="#fff" stroke-width="2.2" stroke-linecap="round" d="M12 7.5v5.5M12 16.5v.01"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
</svg>

<!-- ============ Join screen ============ -->
<main id="join" class="join" hidden>
  <form id="join-form" class="join-card" novalidate>
    <div class="join-logo"><svg><use href="#i-logo"/></svg></div>
    <h1 class="join-title">__CHAT_TITLE__</h1>
    <p class="join-sub">برای ورود به گفتگو یک نام انتخاب کنید.</p>

    <div class="field">
      <label for="name">نام شما</label>
      <input id="name" name="name" maxlength="32" autocomplete="nickname" dir="auto" placeholder="مثلاً: سارا" required>
    </div>

    <div class="field" id="password-row" hidden>
      <label for="password" id="password-label">رمز ورود</label>
      <input id="password" name="password" type="password" autocomplete="current-password" dir="ltr">
    </div>

    <p id="join-error" class="form-error" role="alert" hidden></p>

    <button type="submit" id="join-btn" class="btn-primary">ورود به گفتگو</button>
    <button type="button" id="admin-toggle" class="btn-link" hidden>ورود مدیر</button>
  </form>
  <p class="join-foot">این سایت بدون نیاز به اینترنت بین‌الملل کار می‌کند.</p>
</main>

<!-- ============ Chat screen ============ -->
<div id="chat" class="app" hidden>

  <aside id="sidebar" class="sidebar" aria-label="افراد آنلاین">
    <div class="side-head">
      <h2>آنلاین <span id="side-count" class="count-pill">۰</span></h2>
      <button type="button" id="side-close" class="icon-btn only-mobile" aria-label="بستن"><svg><use href="#i-close"/></svg></button>
    </div>
    <ul id="online-list" class="people"></ul>
    <div class="side-foot">
      <div class="me">
        <span id="me-avatar" class="avatar"></span>
        <div class="me-info">
          <b id="me-name"></b>
          <small id="me-role">شما</small>
        </div>
      </div>
      <button type="button" id="logout-btn" class="btn-ghost"><svg><use href="#i-logout"/></svg><span>خروج</span></button>
    </div>
  </aside>
  <div id="backdrop" class="backdrop"></div>

  <section class="main">
    <header class="topbar">
      <div class="brand-mark"><svg><use href="#i-logo"/></svg></div>
      <div class="topbar-text">
        <h1 id="chat-title">__CHAT_TITLE__</h1>
        <p id="status" class="status" data-state="connecting"><i aria-hidden="true"></i><span id="status-text">در حال اتصال…</span></p>
      </div>
      <button type="button" id="online-btn" class="people-btn only-mobile" aria-controls="sidebar" aria-expanded="false">
        <svg><use href="#i-users"/></svg><span id="online-count">۰</span>
      </button>
    </header>

    <div class="messages-wrap">
      <ul id="messages" class="messages" role="log" aria-label="پیام‌ها"></ul>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon"><svg><use href="#i-logo"/></svg></div>
        <p>هنوز پیامی نیست.<br>اولین پیام را شما بفرستید.</p>
      </div>
      <button type="button" id="jump" class="jump" hidden aria-label="رفتن به پیام‌های جدید">
        <span id="jump-count" class="jump-count" hidden></span>
        <svg><use href="#i-down"/></svg>
      </button>
    </div>

    <form id="composer" class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" maxlength="2000" dir="auto" placeholder="پیام…" aria-label="متن پیام"></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="ارسال" disabled><svg><use href="#i-send"/></svg></button>
      </div>
    </form>
  </section>
</div>

<noscript><p class="noscript">برای استفاده از این چت باید جاوااسکریپت مرورگر فعال باشد.</p></noscript>
</body>
</html>
